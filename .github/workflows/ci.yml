name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web · typecheck · lint · unit (≥90%) · integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restaurant_saas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/restaurant_saas_test?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Write test env
        run: |
          cat > .env.test <<EOF
          DATABASE_URL=${DATABASE_URL}
          AUTH_SECRET=ci-secret-not-used
          TABLE_SECRET_KEY=ci-table-secret-not-used
          EOF

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests with coverage gate
        run: npm run coverage

      - name: Integration tests (Postgres, triggers + constraints)
        run: npm run test:integration
